unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: Calendar date dimension, Year > Quarter > Month > Day. Conformed across every fact (Rule
  21).
type: time
hierarchies:
- unique_name: Date Hierarchy
  label: Date Hierarchy
  folder: Date Attributes
  levels:
  - unique_name: Year
  - unique_name: Quarter
  - unique_name: Month
    secondary_attributes:
    - unique_name: Month Name
      label: Month Name
      description: Calendar month name (e.g. September), independent of year.
      dataset: dim_date
      name_column: month_name
      key_columns:
      - month_name
  - unique_name: Day
    secondary_attributes:
    - unique_name: Day Of Week Name
      label: Day Of Week Name
      description: Weekday name (e.g. Monday).
      dataset: dim_date
      name_column: day_of_week_name
      key_columns:
      - day_of_week_name
    - unique_name: Day Of Week Number
      label: Day Of Week Number
      description: ISO weekday number (1=Mon .. 7=Sun).
      dataset: dim_date
      name_column: day_of_week_num
      key_columns:
      - day_of_week_num
    - unique_name: Is Weekend
      label: Is Weekend
      description: True for Saturday/Sunday.
      dataset: dim_date
      name_column: is_weekend
      key_columns:
      - is_weekend
    - unique_name: Is Current Or Future
      label: Is Current Or Future
      description: True if the date is on or after the bundle's current/as-of date.
      dataset: dim_date
      name_column: is_current_or_future
      key_columns:
      - is_current_or_future
level_attributes:
- unique_name: Year
  label: Year
  description: Calendar year.
  dataset: dim_date
  name_column: year
  key_columns:
  - year
  sort_column: year
  time_unit: year
- unique_name: Quarter
  label: Quarter
  description: Calendar quarter, labeled e.g. 2026-Q3.
  dataset: dim_date
  name_column: quarter_label
  key_columns:
  - quarter_label
  sort_column: quarter_label
  time_unit: quarter
- unique_name: Month
  label: Month
  description: Calendar month, labeled YYYY-MM.
  dataset: dim_date
  name_column: month_label
  key_columns:
  - month_label
  sort_column: month_label
  time_unit: month
- unique_name: Day
  label: Day
  description: Calendar day (ISO date).
  is_unique_key: true
  dataset: dim_date
  name_column: date
  key_columns:
  - date_id
  sort_column: date_id
  time_unit: day
