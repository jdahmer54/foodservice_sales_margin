unique_name: Facility Dimension
object_type: dimension
label: Facility Dimension
description: Hospital / facility site. Embeds Market Dimension for region/state/MSA rollups.
type: standard
hierarchies:
- unique_name: Facility Hierarchy
  label: Facility Hierarchy
  folder: Facility Attributes
  levels:
  - unique_name: Facility
    secondary_attributes:
    - unique_name: Facility Type
      label: Facility Type
      description: Medical Center / Regional Hospital / Community Hospital / etc.
      dataset: dim_facility
      name_column: facility_type
      key_columns:
      - facility_type
    - unique_name: Facility Care Setting
      label: Care Setting
      description: Acute Care Hospital / Behavioral Health / Rehab.
      dataset: dim_facility
      name_column: care_setting
      key_columns:
      - care_setting
    - unique_name: Bed Size Band
      label: Bed Size Band
      description: <100 / 100-249 / 250-499 / 500+.
      dataset: dim_facility
      name_column: bed_size_band
      key_columns:
      - bed_size_band
level_attributes:
- unique_name: Facility
  label: Facility
  description: Hospital / facility site.
  is_unique_key: true
  dataset: dim_facility
  name_column: facility_name
  key_columns:
  - facility_id
relationships:
- unique_name: FacilityDimension_MarketDimension
  from:
    hierarchy: Facility Hierarchy
    level: Facility
    dataset: dim_facility
    join_columns:
    - market_id
  to:
    dimension: Market Dimension
    level: MSA
  type: embedded
