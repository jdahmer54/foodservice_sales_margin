unique_name: staffing_ops
object_type: model
label: Staffing Operations Model
description: 'Order-to-cash staffing operations model: requisitions, submissions, placements, credentialing,
  and rate benchmarking for a travel-nurse / allied-health staffing agency. Covers order-to-fill velocity,
  bill/pay margin integrity, clinician retention and redeployment, credentialing/start-date risk, recruiter
  productivity, and rate competitiveness / demand forecasting.'
visible: true
