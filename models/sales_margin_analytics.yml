unique_name: sales_margin_analytics
object_type: model
label: Sales & Margin Analytics
description: Governed sales and margin model for foodservice distribution. Net Sales, Gross Profit, Gross Profit
  % and Cases Sold are defined once here and consumed by every BI / AI client.
visible: true
relationships:
- unique_name: fact_sales_Date_Dimension
  from:
    dataset: fact_sales
    join_columns:
    - invoice_date_key
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_sales_Organization_Dimension
  from:
    dataset: fact_sales
    join_columns:
    - site_id
  to:
    dimension: Organization Dimension
    level: Site
- unique_name: fact_sales_Product_Dimension
  from:
    dataset: fact_sales
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_sales_Customer_Dimension
  from:
    dataset: fact_sales
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_sales_Supplier_Dimension
  from:
    dataset: fact_sales
    join_columns:
    - supplier_id
  to:
    dimension: Supplier Dimension
    level: Supplier
- unique_name: fact_sales_plan_Date_Dimension
  from:
    dataset: fact_sales_plan
    join_columns:
    - plan_month_key
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_sales_plan_Organization_Dimension
  from:
    dataset: fact_sales_plan
    join_columns:
    - opco_id
  to:
    dimension: Organization Dimension
    level: Operating Company
- unique_name: fact_sales_plan_Product_Dimension
  from:
    dataset: fact_sales_plan
    join_columns:
    - category_id
  to:
    dimension: Product Dimension
    level: Category
dimensions:
- Order Channel Dimension
