unique_name: Gross Profit Prior Year
object_type: metric_calc
label: Gross Profit Prior Year
description: Gross Profit for the same period of the prior fiscal year.
expression: CASE WHEN ISEMPTY([Measures].[Gross Profit]) THEN NULL ELSE (ParallelPeriod([Date Dimension].[Fiscal
  Hierarchy].[Fiscal Year], 1, [Date Dimension].[Fiscal Hierarchy].CurrentMember), [Measures].[Gross Profit]) END
format: "$#,##0.00"
