unique_name: Benchmark_Fill_Rate_Prior_Year
object_type: metric_calc
label: Benchmark Fill Rate Prior Year
description: Benchmark Fill Rate for the same period one year earlier (ParallelPeriod at Year).
expression: 'CASE WHEN ISEMPTY([Measures].[Benchmark_Fill_Rate]) THEN NULL

  ELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember),
  [Measures].[Benchmark_Fill_Rate])

  END'
folder: Rate Competitiveness & Demand
format: percent
