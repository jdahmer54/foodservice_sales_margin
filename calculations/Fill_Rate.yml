unique_name: Fill_Rate
object_type: metric_calc
label: Fill Rate
description: Filled Requisition Count / Requisition Count.
expression: 'CASE WHEN ISEMPTY([Measures].[Requisition_Count]) THEN NULL

  ELSE [Measures].[Filled_Requisition_Count] / [Measures].[Requisition_Count]

  END'
folder: Order-to-Fill Velocity
format: percent
