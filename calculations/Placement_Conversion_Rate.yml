unique_name: Placement_Conversion_Rate
object_type: metric_calc
label: Placement Conversion Rate
description: Placed Submission Count / Submission Count.
expression: 'CASE WHEN ISEMPTY([Measures].[Submission_Count]) THEN NULL

  ELSE [Measures].[Placed_Submission_Count] / [Measures].[Submission_Count]

  END'
folder: Order-to-Fill Velocity
format: percent
