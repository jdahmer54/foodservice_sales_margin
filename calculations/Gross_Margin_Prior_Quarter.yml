unique_name: Gross_Margin_Prior_Quarter
object_type: metric_calc
label: Gross Margin Prior Quarter
description: Avg Gross Margin Hourly for the immediately preceding quarter (adjacent-period PrevMember,
  not same-quarter-last-year — use for quarter-over-quarter margin erosion tracking).
expression: 'CASE WHEN ISEMPTY([Measures].[Avg_Gross_Margin_Hourly]) THEN NULL

  ELSE ([Date Dimension].[Date Hierarchy].[Quarter].CurrentMember.PrevMember, [Measures].[Avg_Gross_Margin_Hourly])

  END'
folder: Bill-Pay Margin Integrity
format: standard
