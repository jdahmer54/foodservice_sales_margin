unique_name: Below_Target_Margin_Rate
object_type: metric_calc
label: Below Target Margin Rate
description: Below Target Margin Count / Placement Count.
expression: 'CASE WHEN ISEMPTY([Measures].[Placement_Count]) THEN NULL

  ELSE [Measures].[Below_Target_Margin_Count] / [Measures].[Placement_Count]

  END'
folder: Bill-Pay Margin Integrity
format: percent
