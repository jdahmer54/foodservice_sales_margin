unique_name: Credentialing_Compliance_Rate
object_type: metric_calc
label: Credentialing Compliance Rate
description: Compliant Item Count / Credential Item Count.
expression: 'CASE WHEN ISEMPTY([Measures].[Credential_Item_Count]) THEN NULL

  ELSE [Measures].[Compliant_Item_Count] / [Measures].[Credential_Item_Count]

  END'
folder: Credentialing & Start-Date Risk
format: percent
