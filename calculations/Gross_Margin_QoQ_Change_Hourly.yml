unique_name: Gross_Margin_QoQ_Change_Hourly
object_type: metric_calc
label: Gross Margin QoQ Change Hourly
description: Avg Gross Margin Hourly minus Gross Margin Prior Quarter, USD/hr.
expression: 'CASE WHEN ISEMPTY([Measures].[Gross_Margin_Prior_Quarter]) THEN NULL

  ELSE [Measures].[Avg_Gross_Margin_Hourly] - [Measures].[Gross_Margin_Prior_Quarter]

  END'
folder: Bill-Pay Margin Integrity
format: standard
