unique_name: Bill_Rate_Index_Vs_Market
object_type: metric_calc
label: Bill Rate Index Vs Market
description: Avg Our Bill Rate / Avg Market Benchmark Bill Rate. Below 100% means priced below market.
expression: 'CASE WHEN ISEMPTY([Measures].[Avg_Market_Benchmark_Bill_Rate]) THEN NULL

  ELSE [Measures].[Avg_Our_Bill_Rate] / [Measures].[Avg_Market_Benchmark_Bill_Rate]

  END'
folder: Rate Competitiveness & Demand
format: percent
