unique_name: Offer_Conversion_Rate
object_type: metric_calc
label: Offer Conversion Rate
description: Offer Extended Count / Submission Count.
expression: 'CASE WHEN ISEMPTY([Measures].[Submission_Count]) THEN NULL

  ELSE [Measures].[Offer_Extended_Count] / [Measures].[Submission_Count]

  END'
folder: Order-to-Fill Velocity
format: percent
