unique_name: Bill_Rate_Vs_Benchmark_Gap_Hourly
object_type: metric_calc
label: Bill Rate Vs Benchmark Gap Hourly
description: Avg Our Bill Rate minus Avg Market Benchmark Bill Rate, USD/hr. Negative means priced below
  market.
expression: 'CASE WHEN ISEMPTY([Measures].[Avg_Our_Bill_Rate]) THEN NULL

  ELSE [Measures].[Avg_Our_Bill_Rate] - [Measures].[Avg_Market_Benchmark_Bill_Rate]

  END'
folder: Rate Competitiveness & Demand
format: standard
