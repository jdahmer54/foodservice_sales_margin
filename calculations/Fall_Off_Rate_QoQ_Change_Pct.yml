unique_name: Fall_Off_Rate_QoQ_Change_Pct
object_type: metric_calc
label: Fall Off Rate QoQ Change Pct
description: Fall Off Rate minus Fall Off Rate Prior Quarter, in percentage points.
expression: 'CASE WHEN ISEMPTY([Measures].[Fall_Off_Rate_Prior_Quarter]) THEN NULL

  ELSE [Measures].[Fall_Off_Rate] - [Measures].[Fall_Off_Rate_Prior_Quarter]

  END'
folder: Retention, Extension & Redeployment
format: percent
