unique_name: fact_credential_item_enriched
object_type: dataset
label: fact_credential_item_enriched
description: 'Query dataset (Rule 15): fact_credential_item joined to fact_placement to bring in specialty_id
  / facility_id / client_id / recruiter_id / msp_program_id, none of which exist on the physical fact_credential_item
  table. All credentialing metrics are defined on this dataset rather than the raw physical table.'
connection_id: Staffing Ops Connection
sql: "SELECT\n  ci.credential_item_id AS credential_item_id,\n  ci.placement_id AS placement_id,\n  ci.clinician_id\
  \ AS clinician_id,\n  ci.document_type_id AS document_type_id,\n  ci.due_date AS due_date,\n  ci.completed_date\
  \ AS completed_date,\n  ci.status AS status,\n  ci.is_compliant AS is_compliant,\n  ci.days_offer_accepted_to_completed\
  \ AS days_offer_accepted_to_completed,\n  p.facility_id AS facility_id,\n  p.specialty_id AS specialty_id,\n\
  \  p.client_id AS client_id,\n  p.recruiter_id AS recruiter_id,\n  p.msp_program_id AS msp_program_id,\n\
  \  CASE WHEN ci.is_compliant THEN 1 ELSE 0 END AS is_compliant_flag,\n  CASE WHEN ci.is_compliant THEN\
  \ 0 ELSE 1 END AS is_outstanding_flag,\n  CASE WHEN ci.completed_date IS NULL OR ci.completed_date >\
  \ ci.due_date\n       THEN 1 ELSE 0 END AS delayed_start_flag\nFROM main.se_library.fact_credential_item\
  \ ci\nJOIN main.se_library.fact_placement p ON ci.placement_id = p.placement_id"
columns:
- name: credential_item_id
  data_type: long
- name: placement_id
  data_type: long
- name: clinician_id
  data_type: long
- name: document_type_id
  data_type: long
- name: due_date
  data_type: date
- name: completed_date
  data_type: date
- name: status
  data_type: string
- name: is_compliant
  data_type: boolean
- name: days_offer_accepted_to_completed
  data_type: long
- name: facility_id
  data_type: long
- name: specialty_id
  data_type: long
- name: client_id
  data_type: long
- name: recruiter_id
  data_type: long
- name: msp_program_id
  data_type: long
- name: is_compliant_flag
  data_type: long
- name: is_outstanding_flag
  data_type: long
- name: delayed_start_flag
  data_type: long
