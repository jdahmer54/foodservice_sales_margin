unique_name: fact_requisition
object_type: dataset
label: fact_requisition
description: One row per open order (requisition) posted by a client facility.
connection_id: Staffing Ops Connection
table: fact_requisition
columns:
- name: requisition_id
  data_type: long
- name: facility_id
  data_type: long
- name: client_id
  data_type: long
- name: market_id
  data_type: long
- name: region
  data_type: string
- name: specialty_id
  data_type: long
- name: msp_program_id
  data_type: long
- name: posted_date
  data_type: date
- name: positions_requested
  data_type: long
- name: target_bill_rate_hourly
  data_type: decimal(18,2)
- name: status
  data_type: string
- name: filled_date
  data_type: date
- name: cancelled_date
  data_type: date
- name: days_to_fill
  data_type: long
- name: age_days_as_of_current
  data_type: long
- name: is_filled_flag
  data_type: long
  sql: CASE WHEN status = 'Filled' THEN 1 ELSE 0 END
- name: is_open_flag
  data_type: long
  sql: CASE WHEN status = 'Open' THEN 1 ELSE 0 END
- name: is_cancelled_flag
  data_type: long
  sql: CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END
