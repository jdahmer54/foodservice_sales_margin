unique_name: fact_submission
object_type: dataset
label: fact_submission
description: One row per clinician submitted against a requisition.
connection_id: Staffing Ops Connection
table: fact_submission
columns:
- name: submission_id
  data_type: long
- name: requisition_id
  data_type: long
- name: clinician_id
  data_type: long
- name: recruiter_id
  data_type: long
- name: submission_date
  data_type: date
- name: offer_extended
  data_type: boolean
- name: offer_date
  data_type: date
- name: placed
  data_type: boolean
- name: placement_id
  data_type: long
- name: final_status
  data_type: string
- name: is_offer_extended_flag
  data_type: long
  sql: CASE WHEN offer_extended THEN 1 ELSE 0 END
- name: is_placed_flag
  data_type: long
  sql: CASE WHEN placed THEN 1 ELSE 0 END
