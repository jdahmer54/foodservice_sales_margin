unique_name: fact_placement
object_type: dataset
label: fact_placement
description: One row per booked assignment leg (an original booking or one extension). previous_placement_id
  self-references the leg this one extended; not modeled as a dimension relationship (no snowflake/self-join
  in the model — see README).
connection_id: Staffing Ops Connection
table: fact_placement
columns:
- name: placement_id
  data_type: long
- name: requisition_id
  data_type: long
- name: clinician_id
  data_type: long
- name: facility_id
  data_type: long
- name: client_id
  data_type: long
- name: specialty_id
  data_type: long
- name: recruiter_id
  data_type: long
- name: msp_program_id
  data_type: long
- name: submission_id
  data_type: long
- name: is_extension
  data_type: boolean
- name: extension_sequence_number
  data_type: long
- name: previous_placement_id
  data_type: long
- name: start_date
  data_type: date
- name: scheduled_end_date
  data_type: date
- name: actual_end_date
  data_type: date
- name: weekly_hours
  data_type: long
- name: bill_rate_hourly
  data_type: decimal(18,2)
- name: pay_rate_hourly
  data_type: decimal(18,2)
- name: gross_margin_hourly
  data_type: decimal(18,2)
- name: offer_accepted_date
  data_type: date
- name: assignment_status
  data_type: string
- name: fall_off_flag
  data_type: boolean
- name: reason_code_id
  data_type: long
- name: has_next_assignment_booked
  data_type: boolean
- name: gap_days_to_next_assignment
  data_type: long
- name: is_extension_flag
  data_type: long
  sql: CASE WHEN is_extension THEN 1 ELSE 0 END
- name: is_fall_off_flag_num
  data_type: long
  sql: CASE WHEN fall_off_flag THEN 1 ELSE 0 END
- name: is_below_target_margin_flag
  data_type: long
  sql: CASE WHEN gross_margin_hourly < 15.00 THEN 1 ELSE 0 END
- name: no_next_assignment_flag
  data_type: long
  sql: CASE WHEN has_next_assignment_booked = false THEN 1 ELSE 0 END
- name: gross_profit_amount
  data_type: decimal(18,2)
  sql: gross_margin_hourly * weekly_hours * 13
