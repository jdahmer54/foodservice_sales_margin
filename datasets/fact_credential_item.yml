unique_name: fact_credential_item
object_type: dataset
label: fact_credential_item
description: One row per required credential document, per placement. Physical table only — not attached
  to the model directly. Credentialing metrics are defined on fact_credential_item_enriched (a query dataset
  that joins in specialty_id / facility_id / client_id / recruiter_id / msp_program_id from fact_placement,
  since this table carries none of those FKs itself — see README, Rule 15).
connection_id: Staffing Ops Connection
table: fact_credential_item
columns:
- name: credential_item_id
  data_type: long
- name: placement_id
  data_type: long
- name: clinician_id
  data_type: long
- name: document_type_id
  data_type: long
- name: due_date
  data_type: date
- name: completed_date
  data_type: date
- name: status
  data_type: string
- name: is_compliant
  data_type: boolean
- name: days_offer_accepted_to_completed
  data_type: long
